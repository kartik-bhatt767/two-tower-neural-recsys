version: '3.8'

services:
  recsys-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: two-tower-neural-recsys
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
